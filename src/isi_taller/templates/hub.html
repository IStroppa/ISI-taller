<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if username %}
        <div class="container">
            <h1>Bienvenido, {{ username }}</h1>
            <br>
            <a href=""{{ url_for('ask') }}><button type="redirect">Hacer una pregunta</button></a>
            <br>
            <a href="{{ url_for('logout') }}"><button type="redirect">Cerrar sesión</button></a>
        </div>
    {% else %}
        {% if error %}
            <p style="color: red; text-align: center;"><strong>Error:</strong> {{ error }}</p>
        {% else %}
            <div class="container">
            <h1>Bienvenido</h1>
            <br>
            <a href="{{ url_for('login_get') }}"><button type="redirect">Iniciar sesión</button></a>
        </div>
        
        {% endif %}
    {% endif %}
</body>
</html>
